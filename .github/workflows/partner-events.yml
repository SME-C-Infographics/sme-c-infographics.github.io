name: Validate Partner Events

on:
  pull_request:
    paths:
      - "partner-events/**"
      - "events/partner-events.html"
      - "scripts/generate-partner-events.py"
      - "scripts/tests/test_partner_events.py"
      - ".github/workflows/partner-events.yml"
      - ".github/workflows/ensure-site-chrome.yml"
      - ".github/workflows/fix-site-chrome-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test event validation and rendering
        run: python3 -m unittest discover -s scripts/tests -p "test_partner_events.py"

      - name: Validate Markdown submissions
        run: python3 scripts/generate-partner-events.py --validate-only

      - name: Generate preview
        run: |
          python3 scripts/generate-partner-events.py
          python3 scripts/generate-partner-events.py --check

      - name: Upload standalone page preview
        uses: actions/upload-artifact@v4
        with:
          name: partner-events-preview
          path: events/partner-events.html
          if-no-files-found: error
